[project]
name = "ai-tutor-training"
version = "0.4.0"
description = "Data preparation and training pipeline for AI Tutor"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.25.0",
    "jsonschema>=4.23.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "reportlab>=4.0.0",
    "hypothesis>=6.100.0",
    "pytest-benchmark>=4.0.0",
]
gpu = [
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "peft>=0.13.0",
    "bitsandbytes>=0.44.0",
    "trl>=0.12.0",
    "datasets>=3.0.0",
]

[project.scripts]
ai-tutor-pipeline = "ai_tutor_training.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", ".."]
markers = [
    "unit: Isolated pure function, regex, and provenance unit tests.",
    "integration: Subsystem interaction, database operations, and stage handoffs.",
    "regression: Defect prevention, historical edge cases, and Windows file-locking hardening.",
    "path: Linearly independent basis path and branch coverage tests.",
    "property: Generative property-based fuzz tests using Hypothesis.",
    "stress: Scalability, latency, and throughput benchmarks.",
    "e2e: End-to-end pipeline verification from PDF to SQLite.",
]
